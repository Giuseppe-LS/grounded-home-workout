<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4efe6"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>Grounded — Home Workout</title></head><body><header><div><small>GROUNDED</small><h1>Home Workout</h1></div><button id="installBtn" hidden>Install</button></header><main><section id="home" class="view active"><div class="hero"><p>Move well. Get stronger. Stay balanced.</p><h2>Three gentle, focused sessions each week.</h2></div><h3>Your workouts</h3><div id="workoutCards" class="cards"></div><div class="stats"><div><strong id="weekCount">0</strong><span>sessions this week</span></div><div><strong id="latestWeight">—</strong><span>latest weight</span></div></div></section><section id="workout" class="view"><button class="back" data-go="home">← All workouts</button><h2 id="workoutTitle"></h2><p id="workoutMeta" class="muted"></p><div id="exerciseList"></div><label class="field">How did it feel?<select id="difficulty"><option value="Good">Good</option><option value="Easy">Easy</option><option value="Challenging">Challenging</option></select></label><label class="field">Notes<textarea id="sessionNotes" placeholder="Anything worth remembering?"></textarea></label><button id="completeWorkout" class="primary">Complete workout</button></section><section id="progress" class="view"><h2>Progress</h2><p class="muted">Consistency matters more than perfection.</p><div class="panel"><h3>Log body weight</h3><div class="weight-row"><input id="weightInput" type="number" inputmode="decimal" step="0.1" placeholder="58.0"><span>kg</span><button id="saveWeight">Save</button></div></div><div class="panel"><h3>Weight history</h3><canvas id="weightChart" width="600" height="260"></canvas><div id="weightHistory"></div></div><div class="panel"><h3>Completed sessions</h3><div id="sessionHistory"></div></div></section></main><nav><button data-go="home" class="nav-active">Workouts</button><button data-go="progress">Progress</button></nav><script src="app.js"></script></body></html>
